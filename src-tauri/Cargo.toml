[package]
name = "easyide"
version = "0.2.0"
description = "EasyIDE - 轻量极速的 AI 代码 IDE"
authors = ["clb"]
edition = "2021"

[lib]
name = "easyide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "8"
walkdir = "2"
regex = "1"
trash = "5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
percent-encoding = "2"
winreg = "0.52"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

# 发布构建：小体积优先
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
